<VirtualHost *:80>
    ServerName localhost

    <Location /svn>
        DAV svn
        SVNParentPath /var/svn/repos
        SVNListParentPath On

        # Authentication only (who the caller is) -- stands in here for
        # whatever real upstream module a production deployment uses (e.g.
        # mod_auth_openidc). Authorization is entirely handled by the
        # LuaHookAuthChecker chain below, which runs after this and does
        # not otherwise depend on AuthType/Require.
        AuthType Basic
        AuthName "Subversion"
        AuthUserFile /etc/subversion/passwd
        Require valid-user

        # TEST-ONLY: maps the just-authenticated r.user to a role claim in
        # AUTHZ_LUA_ROLES, standing in for a real claims-issuing module.
        # Registered before svn-authz.lua's hook so the role is already in
        # subprocess_env by the time it runs. Do not use in production --
        # see docker/test-roles.lua and the README's "Testing" section.
        LuaHookAuthChecker /opt/subversion-auth/docker/test-roles.lua assign_test_roles

        LuaHookAuthChecker /opt/subversion-auth/mod-lua/svn-authz.lua authz_check_access
        SetEnv AUTHZ_LUA_ACCS_DIR /var/lib/subversion-auth/accs
        SetEnv AUTHZ_LUA_ROLES_VAR AUTHZ_LUA_ROLES
    </Location>
</VirtualHost>
